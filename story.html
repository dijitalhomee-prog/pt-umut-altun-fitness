<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Instagram Story (1080x1920) | PT Umut Altun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #08080A;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 120px 50px 100px 50px;
    }

    /* Ambient Glow Backgrounds */
    .glow-top {
      position: absolute;
      top: -250px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.3) 0%, rgba(8, 8, 10, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .glow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 1000px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.22) 0%, rgba(8, 8, 10, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Top Badge */
    .story-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 18px 42px;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid #EF4444;
      border-radius: 100px;
      color: #EF4444;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.4);
      z-index: 10;
    }

    /* Main Title */
    .story-title {
      text-align: center;
      margin-top: 20px;
      z-index: 10;
    }

    .story-title h1 {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .story-title .red-text {
      color: #EF4444;
      display: block;
    }

    /* Center Media Card */
    .trainer-card-wrapper {
      position: relative;
      width: 640px;
      height: 720px;
      margin: 30px 0;
      z-index: 10;
    }

    .trainer-img-card {
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      border: 3px solid rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 70px rgba(239, 68, 68, 0.4);
      position: relative;
    }

    .trainer-img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Floating Feature Badges */
    .feature-badge-item {
      position: absolute;
      background: rgba(15, 20, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(239, 68, 68, 0.45);
      padding: 22px 30px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      white-space: nowrap;
      z-index: 20;
    }

    .feature-badge-item i {
      font-size: 34px;
      color: #EF4444;
    }

    .feature-badge-item span {
      font-size: 24px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .pos-top-left { top: 30px; left: -160px; }
    .pos-top-right { top: 30px; right: -160px; }
    .pos-bottom-left { bottom: 30px; left: -160px; }
    .pos-bottom-right { bottom: 30px; right: -160px; }

    /* Bottom Clean Space */
    .story-footer-space {
      height: 120px;
      width: 100%;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-center"></div>

  <!-- Top Badge -->
  <div class="story-badge">
    <i class="fas fa-bolt"></i> YENİ PLATFORM YAYINDA!
  </div>

  <!-- Header Title -->
  <div class="story-title">
    <h1>PT UMUT ALTUN</h1>
    <h1 class="red-text">UZAKTAN KOÇLUK & BESLENME</h1>
  </div>

  <!-- Trainer Photo Card with Badges -->
  <div class="trainer-card-wrapper">
    
    <div class="feature-badge-item pos-top-left">
      <i class="fas fa-dumbbell"></i>
      <span>Birebir Özel Antrenman</span>
    </div>

    <div class="feature-badge-item pos-top-right">
      <i class="fas fa-utensils"></i>
      <span>Esnek Beslenme & Makro</span>
    </div>

    <div class="trainer-img-card">
      <img src="assets/images/trainer_umut.jpg" alt="PT Umut Altun">
    </div>

    <div class="feature-badge-item pos-bottom-left">
      <i class="fab fa-whatsapp" style="color: #25D366;"></i>
      <span>7/24 WhatsApp Desteği</span>
    </div>

    <div class="feature-badge-item pos-bottom-right">
      <i class="fas fa-map-marker-alt"></i>
      <span>Cevahir MACFit Birebir PT</span>
    </div>

  </div>

  <!-- Bottom Open Area for Instagram Sticker -->
  <div class="story-footer-space"></div>

</body>
</html>
